plugins {
    id 'java'
    id 'io.qameta.allure' version '4.0.1'
    id 'io.freefair.lombok' version '9.5.0'
}

group = 'guru.qa'
version = '1.0'

repositories {
    mavenCentral()
}

def allureVersion = "2.25.0",
    selenideVersion = "7.17.0",
    slf4jVersion = "2.0.16",
    junitVersion = "5.11.4",
    ownerVersion = "1.0.12",
    assertjCoreVersion = "3.27.7",
    hamcrestVersion = "3.0",
    restAssuredVersion = "5.5.0",
    jsonassertVersion = "1.5.3",
    databindVersion = "2.17.1"


allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:$junitVersion")

    testImplementation(
            "org.junit.jupiter:junit-jupiter",
            "com.codeborne:selenide:$selenideVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "io.qameta.allure:allure-junit5:$allureVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "org.aeonbits.owner:owner:$ownerVersion",
            "org.assertj:assertj-core:$assertjCoreVersion",
            "org.hamcrest:hamcrest:$hamcrestVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "org.skyscreamer:jsonassert:$jsonassertVersion",
            "com.fasterxml.jackson.core:jackson-databind:$databindVersion"

    )

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    systemProperty("allure.results.directory", "build/allure-results")
    testLogging {
        events "passed", "skipped", "failed"
    }
}